<text x="60" y="750" font-size="22" fill="#f1f5f9" text-anchor="start" font-weight="600">实施映射</text>
<text x="60" y="792" font-size="19" fill="#a9bad0" text-anchor="start" font-weight="400">第一阶段：现有 400 V AFE 供给 800 V 后级测试台，细化 IBC / VRM / 馈线 / 储能动态。</text>
<text x="60" y="830" font-size="19" fill="#a9bad0" text-anchor="start" font-weight="400">完整目标：显式接入中压 SST 各变换级；当前 AFE 本身不代表 SST。储能端口位置与控制需在模型中明确。</text>
<text x="60" y="885" font-size="17" fill="#a9bad0" text-anchor="start" font-weight="400">来源：OCP / NVIDIA（设施与储能）；TI / Microchip / Infineon（IBC 与 VRM）。连线为研究方案。</text>
